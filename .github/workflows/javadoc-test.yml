name: Javadoc

on: workflow_call

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      SHARED: /tmp/workdir/pki
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Retrieve PKI images
        uses: actions/cache@v5
        with:
          key: pki-images-${{ github.sha }}
          path: pki-images.tar

      - name: Load PKI images
        run: docker load --input pki-images.tar

      - name: Set up runner container
        run: |
          tests/bin/runner-init.sh \
              --hostname=pki.example.com \
              pki

      - name: Check Javadoc RPM
        run: |
          docker exec pki rpm -qa | grep -E "^dogtag-|^python3-dogtag-"

          docker exec pki rpm -ql dogtag-pki-javadoc

      - name: Check Javadoc folder
        run: |
          docker exec pki ls -la /usr/share

          docker exec pki ls -la /usr/share/javadoc

          docker exec pki find /usr/share/javadoc/pki -type d \
              | sed '/\/class-use$/d' \
              | tee output
