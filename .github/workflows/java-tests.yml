name: Java Tests

on: [push, pull_request]

jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    name: Waiting for build
    uses: ./.github/workflows/wait-for-build.yml
    secrets: inherit

  java-client-test:
    name: Java Client
    needs: build
    uses: ./.github/workflows/java-client-test.yml

  javadoc-test:
    name: Javadoc
    needs: build
    uses: ./.github/workflows/javadoc-test.yml
