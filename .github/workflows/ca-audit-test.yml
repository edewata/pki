          TOTAL_LOGS=$(cat total_logs)
          echo "TOTAL_LOGS: $TOTAL_LOGS"

          # get new audit logs
          docker exec pki cat /var/lib/pki/pki-tomcat/logs/ca/signedAudit/ca_audit \
              | sed -E \
                  -e "1,${TOTAL_LOGS}d" \
                  -e 's/^.*(\[AuditEvent=.*)$/\1/' \
              | tee output

          # get verifiable events and properties
          sed -E \
              -e '/^.*\[AuditEvent=ACCESS_SESSION_ESTABLISH\].*$/d' \
              -e '/^.*\[AuditEvent=ACCESS_SESSION_TERMINATED\].*$/d' \
              -e '/^.*\[AuditEvent=AUDIT_LOG_SIGNING\].*$/d' \
              -e 's/^.*\[AuditEvent=(AUTH)\].*\[SubjectID=([^]]*)\].*\[AuthMgr=([^]]*)\].*$/\2 \1 \3/' \
              -e 's/^.*\[AuditEvent=(AUTHZ)\].*\[SubjectID=([^]]*)\].*\[aclResource=([^]]*)\].*\[Op=([^]]*)\].*$/\2 \1 \3 \4/' \
              -e 's/^.*\[AuditEvent=(ROLE_ASSUME)\].*\[SubjectID=([^]]*)\].*$/\2 \1/' \
              output > actual

          # OCSP validation, login, audit operations, and logout
          # should be logged
          cat > expected << EOF
          \$NonRoleUser\$ AUTHZ certServer.ee.request.ocsp submit
          caauditor AUTH certUserDBAuthMgr
          caauditor AUTHZ certServer.ca.account login
          caauditor ROLE_ASSUME
          caauditor AUTHZ certServer.log.content.signedAudit read
          caauditor ROLE_ASSUME
          caauditor AUTHZ certServer.ca.account logout
          caauditor ROLE_ASSUME
          EOF

          diff expected actual

          # check SSL session events
          sed -En \
              -e '/^.*\[AuditEvent=ACCESS_SESSION_ESTABLISH\].*$/p' \
              -e '/^.*\[AuditEvent=ACCESS_SESSION_TERMINATED\].*$/p' \
              output > actual

          # there should be some SSL session events
          [ -s actual ]

          # check audit signing events
          sed -En \
              -e '/^.*\[AuditEvent=AUDIT_LOG_SIGNING\].*$/p' \
              output > actual

          # there should be some audit signing events
          [ -s actual ]

          NEW_LOGS=$(cat output | wc -l)
          echo "NEW_LOGS: $NEW_LOGS"
          echo $((TOTAL_LOGS + NEW_LOGS)) > total_logs

      - name: Export audit log files
        run: |
          docker exec pki pki \
              -n caauditor \
              ca-audit-file-retrieve \
              --output $SHARED/ca_audit \
              ca_audit

          TOTAL_LOGS=$(cat total_logs)
          echo "TOTAL_LOGS: $TOTAL_LOGS"

          # get new audit logs
          docker exec pki cat /var/lib/pki/pki-tomcat/logs/ca/signedAudit/ca_audit \
              | sed -E \
                  -e "1,${TOTAL_LOGS}d" \
                  -e 's/^.*(\[AuditEvent=.*)$/\1/' \
              | tee output

          # get verifiable events and properties
          sed -E \
              -e '/^.*\[AuditEvent=ACCESS_SESSION_ESTABLISH\].*$/d' \
              -e '/^.*\[AuditEvent=ACCESS_SESSION_TERMINATED\].*$/d' \
              -e '/^.*\[AuditEvent=AUDIT_LOG_SIGNING\].*$/d' \
              -e 's/^.*\[AuditEvent=(AUTH)\].*\[SubjectID=([^]]*)\].*\[AuthMgr=([^]]*)\].*$/\2 \1 \3/' \
              -e 's/^.*\[AuditEvent=(AUTHZ)\].*\[SubjectID=([^]]*)\].*\[aclResource=([^]]*)\].*\[Op=([^]]*)\].*$/\2 \1 \3 \4/' \
              -e 's/^.*\[AuditEvent=(ROLE_ASSUME)\].*\[SubjectID=([^]]*)\].*$/\2 \1/' \
              output > actual

          # OCSP validation, login, audit operations, and logout
          # should be logged
          cat > expected << EOF
          \$NonRoleUser\$ AUTHZ certServer.ee.request.ocsp submit
          caauditor AUTH certUserDBAuthMgr
          caauditor AUTHZ certServer.ca.account login
          caauditor ROLE_ASSUME
          caauditor AUTHZ certServer.log.content.signedAudit read
          caauditor ROLE_ASSUME
          caauditor AUTHZ certServer.ca.account logout
          caauditor ROLE_ASSUME
          EOF

          diff expected actual

          # check SSL session events
          sed -En \
              -e '/^.*\[AuditEvent=ACCESS_SESSION_ESTABLISH\].*$/p' \
              -e '/^.*\[AuditEvent=ACCESS_SESSION_TERMINATED\].*$/p' \
              output > actual

          # there should be some SSL session events
          [ -s actual ]

          # check audit signing events
          sed -En \
              -e '/^.*\[AuditEvent=AUDIT_LOG_SIGNING\].*$/p' \
              output > actual

          # there should be some audit signing events
          [ -s actual ]

          NEW_LOGS=$(cat output | wc -l)
          echo "NEW_LOGS: $NEW_LOGS"
          echo $((TOTAL_LOGS + NEW_LOGS)) > total_logs

      - name: Validate exported audit logs
        run: |
          # ideally the exported audit log file should be
          # identical to the actual audit log file stored on
          # the server, but the exported file will be shorter
          # than the actual file since after exporting the
          # file the pki ca-audit-file-retrieve will perform
          # a logout operation which will only be recorded in
          # the actual log file. so in order to compare
          # properly the actual log file needs to be trimmed
          # to match the size of the exported log file.

          # get the size of exported audit log file
          SIZE=$(stat -c '%s' ca_audit)
          echo "SIZE: $SIZE"

          # trim actual audit log file to match exported file
          docker exec pki head \
              -c $SIZE \
              /var/lib/pki/pki-tomcat/logs/ca/signedAudit/ca_audit \
              > expected

          diff expected ca_audit

      - name: Validate signatures in exported audit logs
        run: |
          docker exec pki pki nss-cert-import \
              --cert ca_audit_signing.crt \
              --trust ,,P \
              ca_audit_signing

          cat > filenames << EOF
          $SHARED/ca_audit
          EOF

          docker exec pki AuditVerify \
              -d /root/.dogtag/nssdb \
              -n ca_audit_signing \
              -a $SHARED/filenames \
              | tee output

          # normalize output
          sed -E -e '/^$/d' output > actual

          cat > expected << EOF
          Verification process complete.
          Valid signatures: 40
          Invalid signatures: 0
          EOF

          diff expected actual

      - name: Remove CA
        run: |
          docker exec pki pkidestroy -s CA

          TOTAL_LOGS=$(cat total_logs)
          echo "TOTAL_LOGS: $TOTAL_LOGS"

          # get new audit logs
          docker exec pki cat /var/lib/pki/pki-tomcat/logs/ca/signedAudit/ca_audit \
              | sed -E \
                  -e "1,${TOTAL_LOGS}d" \
                  -e 's/^.*(\[AuditEvent=.*)$/\1/' \
              | tee output

          # get verifiable events and properties
          sed -E \
              -e '/^.*\[AuditEvent=ACCESS_SESSION_ESTABLISH\].*$/d' \
              -e '/^.*\[AuditEvent=ACCESS_SESSION_TERMINATED\].*$/d' \
              -e '/^.*\[AuditEvent=AUDIT_LOG_SIGNING\].*$/d' \
              -e 's/^.*\[AuditEvent=(AUTH)\].*\[SubjectID=([^]]*)\].*\[AuthMgr=([^]]*)\].*$/\2 \1 \3/' \
              -e 's/^.*\[AuditEvent=(AUTHZ)\].*\[SubjectID=([^]]*)\].*\[aclResource=([^]]*)\].*\[Op=([^]]*)\].*$/\2 \1 \3 \4/' \
              -e 's/^.*\[AuditEvent=(ROLE_ASSUME)\].*\[SubjectID=([^]]*)\].*$/\2 \1/' \
              -e 's/^.*\[AuditEvent=(CONFIG_ROLE)\].*\[SubjectID=([^]]*)\].*$/\2 \1/' \
              -e 's/^.*\[AuditEvent=(SECURITY_DOMAIN_UPDATE)\].*\[SubjectID=([^]]*)\].*$/\2 \1/' \
              output > actual

          # security domain operations should be logged
          cat > expected << EOF
          CA-pki.example.com-8443 AUTH certUserDBAuthMgr
          CA-pki.example.com-8443 AUTHZ certServer.securitydomain.domainxml modify
          CA-pki.example.com-8443 ROLE_ASSUME
          CA-pki.example.com-8443 CONFIG_ROLE
          CA-pki.example.com-8443 CONFIG_ROLE
          CA-pki.example.com-8443 SECURITY_DOMAIN_UPDATE
          EOF

          diff expected actual

          # check SSL session events
          sed -En \
              -e '/^.*\[AuditEvent=ACCESS_SESSION_ESTABLISH\].*$/p' \
              -e '/^.*\[AuditEvent=ACCESS_SESSION_TERMINATED\].*$/p' \
              output > actual

          # there should be some SSL session events
          [ -s actual ]

          # check audit signing events
          sed -En \
              -e '/^.*\[AuditEvent=AUDIT_LOG_SIGNING\].*$/p' \
              output > actual

          # there should be some audit signing events
          [ -s actual ]

          NEW_LOGS=$(cat output | wc -l)
          echo "NEW_LOGS: $NEW_LOGS"
          echo $((TOTAL_LOGS + NEW_LOGS)) > total_logs

      - name: Check DS server systemd journal
        if: always()
        run: |
          docker exec ds journalctl -x --no-pager -u dirsrv@localhost.service

      - name: Check DS container logs
        if: always()
        run: |
          docker logs ds

      - name: Check PKI server systemd journal
        if: always()
        run: |
          docker exec pki journalctl -x --no-pager -u pki-tomcatd@pki-tomcat.service

      - name: Check PKI server access log
        if: always()
        run: |
          docker exec pki find /var/log/pki/pki-tomcat -name "localhost_access_log.*" -exec cat {} \;

      - name: Check CA debug log
        if: always()
        run: |
          docker exec pki find /var/lib/pki/pki-tomcat/logs/ca -name "debug.*" -exec cat {} \;
