          sed -E \
              -e '/^ *[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2})+:?$/d' \
              -e '/^ *Serial Number:$/d' \
              -e '/^ *Validity$/d' \
              -e '/^ *Not Before:/d' \
              -e '/^ *Not After :/d' \
              -e '/^ *Modulus:$/d' \
              -e '/^ *Signature Value:$/d' \
