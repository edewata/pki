          diff expected output

      - name: Check initial audit logs
        run: |
          # check audit log folder
          docker exec pki ls -1 /var/lib/pki/pki-tomcat/logs/ca/signedAudit | tee output

          # there should be one log file
          cat > expected << EOF
          ca_audit
          EOF

          diff expected output

          # get audit log files
          docker exec pki pki-server ca-audit-file-find | tee output

          sed -n "s/^\s*File name: \s*\(\S*\)$/\1/p" output > actual

          # there should be one log file
          cat > expected << EOF
          ca_audit
          EOF

          diff expected actual

          # get initial audit logs
          docker exec pki cat /var/lib/pki/pki-tomcat/logs/ca/signedAudit/ca_audit \
              | sed -E 's/^.*(\[AuditEvent=.*)$/\1/' \
              | tee output

          # get verifiable events and properties
          sed -E \
              -e '/^.*\[AuditEvent=ACCESS_SESSION_ESTABLISH\].*$/d' \
              -e '/^.*\[AuditEvent=ACCESS_SESSION_TERMINATED\].*$/d' \
              -e 's/^.*\[AuditEvent=(CERT_SIGNING_INFO)\].*\[SubjectID=([^]]*)\].*$/\2 \1/' \
              -e 's/^.*\[AuditEvent=(CRL_SIGNING_INFO)\].*\[SubjectID=([^]]*)\].*$/\2 \1/' \
              -e 's/^.*\[AuditEvent=(OCSP_SIGNING_INFO)\].*\[SubjectID=([^]]*)\].*$/\2 \1/' \
              -e 's/^.*\[AuditEvent=(SELFTESTS_EXECUTION)\].*\[SubjectID=([^]]*)\].*$/\2 \1/' \
              output > actual

          # signing certs and selftests should be logged
          cat > expected << EOF
          \$System\$ CERT_SIGNING_INFO
          \$System\$ CRL_SIGNING_INFO
          \$System\$ OCSP_SIGNING_INFO
          \$System\$ SELFTESTS_EXECUTION
          EOF

          diff expected actual

          # check SSL session events
          sed -En \
              -e '/^.*\[AuditEvent=ACCESS_SESSION_ESTABLISH\].*$/p' \
              -e '/^.*\[AuditEvent=ACCESS_SESSION_TERMINATED\].*$/p' \
              output > actual

          # there should be some SSL session events
          [ -s actual ]

          NEW_LOGS=$(cat output | wc -l)
          echo "NEW_LOGS: $NEW_LOGS"
          echo $NEW_LOGS > total_logs

      - name: Install admin cert
        run: |
          docker exec pki pki-server cert-export \
              --cert-file ca_signing.crt \
              ca_signing

          docker exec pki pki nss-cert-import \
              --cert ca_signing.crt \
              --trust CT,C,C \
              ca_signing

          docker exec pki pki pkcs12-import \
              --pkcs12 /root/.dogtag/pki-tomcat/ca_admin_cert.p12 \
              --password Secret.123

      - name: Check admin user
        run: |
          docker exec pki pki -n caadmin ca-user-show caadmin

          TOTAL_LOGS=$(cat total_logs)
          echo "TOTAL_LOGS: $TOTAL_LOGS"

          # get new audit logs
          docker exec pki cat /var/lib/pki/pki-tomcat/logs/ca/signedAudit/ca_audit \
              | sed -E \
                  -e "1,${TOTAL_LOGS}d" \
                  -e 's/^.*(\[AuditEvent=.*)$/\1/' \
              | tee output

          # get verifiable events and properties
          sed -E \
              -e '/^.*\[AuditEvent=ACCESS_SESSION_ESTABLISH\].*$/d' \
              -e '/^.*\[AuditEvent=ACCESS_SESSION_TERMINATED\].*$/d' \
              -e 's/^.*\[AuditEvent=(AUTH)\].*\[SubjectID=([^]]*)\].*\[AuthMgr=([^]]*)\].*$/\2 \1 \3/' \
              -e 's/^.*\[AuditEvent=(AUTHZ)\].*\[SubjectID=([^]]*)\].*\[aclResource=([^]]*)\].*\[Op=([^]]*)\].*$/\2 \1 \3 \4/' \
              -e 's/^.*\[AuditEvent=(ROLE_ASSUME)\].*\[SubjectID=([^]]*)\].*$/\2 \1/' \
              output > actual
          cat actual

          # OCSP validation, login, user operation, and logout should be logged
