          # check SSL session events
          sed -En \
              -e '/^.*\[AuditEvent=ACCESS_SESSION_ESTABLISH\].*$/p' \
              -e '/^.*\[AuditEvent=ACCESS_SESSION_TERMINATED\].*$/p' \
