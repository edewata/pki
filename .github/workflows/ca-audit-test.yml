            Enabled: True
            Filter: None

            Event Name: AUDIT_LOG_STARTUP
            Enabled: True
            Filter: None

            Event Name: AUTH
            Enabled: True
            Filter: None

            Event Name: AUTHORITY_CONFIG
            Enabled: True
            Filter: None

            Event Name: AUTHZ
            Enabled: True
            Filter: None

            Event Name: CERT_PROFILE_APPROVAL
            Enabled: True
            Filter: None

            Event Name: CERT_REQUEST_PROCESSED
            Enabled: True
            Filter: None

            Event Name: CERT_SIGNING_INFO
            Enabled: True
            Filter: None

            Event Name: CERT_STATUS_CHANGE_REQUEST
            Enabled: True
            Filter: None

            Event Name: CERT_STATUS_CHANGE_REQUEST_PROCESSED
            Enabled: True
            Filter: None

