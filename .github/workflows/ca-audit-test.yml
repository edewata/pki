          \$NonRoleUser\$ AUTHZ certServer.ee.request.ocsp submit
          caadmin AUTH certUserDBAuthMgr
          caadmin AUTHZ certServer.ca.account login
          caadmin ROLE_ASSUME
          caadmin AUTHZ certServer.ca.users execute
          caadmin ROLE_ASSUME
          caadmin AUTHZ certServer.ca.account logout
          caadmin ROLE_ASSUME
          EOF

