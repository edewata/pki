name: CA with custom profile
# The test will perform the following:
# - customize CA webapp
# - create a custom profile with wide chars in the name and description
# - enroll a cert with wide chars in the subject DN
# - create a user with wide chars in the full name
# - authenticate as the user using the cert

on: workflow_call

env:
  DS_IMAGE: ${{ vars.DS_IMAGE || 'quay.io/389ds/dirsrv' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      SHARED: /tmp/workdir/pki
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install xmlstarlet

      - name: Clone repository
        uses: actions/checkout@v7

      - name: Retrieve PKI images
        uses: actions/cache@v5
        with:
          key: pki-images-${{ github.sha }}
          path: pki-images.tar

      - name: Load PKI images
        run: docker load --input pki-images.tar

      - name: Create network
        run: docker network create example

      - name: Set up DS container
        run: |
          tests/bin/ds-create.sh \
              --image=${{ env.DS_IMAGE }} \
              --hostname=ds.example.com \
              --network=example \
              --network-alias=ds.example.com \
              --password=Secret.123 \
              ds

      - name: Set up PKI container
        run: |
          tests/bin/runner-init.sh \
              --hostname=pki.example.com \
              --network=example \
              --network-alias=pki.example.com \
              pki

      - name: Install CA
        run: |
          docker exec pki pkispawn \
              -f /usr/share/pki/server/examples/installation/ca.cfg \
              -s CA \
              -D pki_ds_url=ldap://ds.example.com:3389 \
              -v

      - name: Install CA admin cert
        run: |
          docker exec pki pki-server cert-export \
              --cert-file ca_signing.crt \
              ca_signing

          docker exec pki pki nss-cert-import \
              --cert ca_signing.crt \
              --trust CT,C,C \
              ca_signing

          docker exec pki pki pkcs12-import \
              --pkcs12 /root/.dogtag/pki-tomcat/ca_admin_cert.p12 \
              --password Secret.123

      - name: Check default auth plugins
        run: |
          docker exec pki pki-server ca-auth-plugin-find \
              | tee output

          cat > expected << EOF
            Plugin ID: AgentCertAuth
            Class Name: com.netscape.cms.authentication.AgentCertAuthentication

            Plugin ID: CMCAuth
            Class Name: com.netscape.cms.authentication.CMCAuth

            Plugin ID: CMCAuthForEST
            Class Name: com.netscape.cms.authentication.CMCAuthForEST

            Plugin ID: CMCUserSignedAuth
            Class Name: com.netscape.cms.authentication.CMCUserSignedAuth

            Plugin ID: FlatFileAuth
            Class Name: com.netscape.cms.authentication.FlatFileAuth

            Plugin ID: SSLclientCertAuth
            Class Name: com.netscape.cms.authentication.SSLclientCertAuthentication

            Plugin ID: SessionAuthentication
            Class Name: com.netscape.cms.authentication.SessionAuthentication

            Plugin ID: SharedToken
            Class Name: com.netscape.cms.authentication.SharedSecret

            Plugin ID: TokenAuth
            Class Name: com.netscape.cms.authentication.TokenAuthentication

            Plugin ID: UidPwdDirAuth
            Class Name: com.netscape.cms.authentication.UidPwdDirAuthentication

            Plugin ID: UidPwdGroupDirAuth
            Class Name: com.netscape.cms.authentication.UidPwdGroupDirAuthentication

            Plugin ID: UidPwdPinDirAuth
            Class Name: com.netscape.cms.authentication.UidPwdPinDirAuthentication

            Plugin ID: UserPwdDirAuth
            Class Name: com.netscape.cms.authentication.UserPwdDirAuthentication
          EOF

          diff expected output

      - name: Install JDK
        run: |
          docker exec pki dnf install -y java-25-openjdk-devel

      - name: Undeploy CA webapp
        run: |
          docker exec pki pki-server webapp-undeploy \
              --wait \
              ca

      - name: Customize CA webapp folder
        run: |
          # create CA webapp deployment folder
          docker exec pki mkdir -p /var/lib/pki/pki-tomcat/webapps/ca

          # create links to files in original CA webapp folder
          docker exec pki find \
              /usr/share/pki/ca/webapps/ca \
              -mindepth 1 \
              -maxdepth 1 \
              -exec ln -s {} /var/lib/pki/pki-tomcat/webapps/ca \;

          # update owner/permission
          docker exec pki chown -R pkiuser:pkiuser /var/lib/pki/pki-tomcat/webapps/ca

          docker exec pki ls -l /var/lib/pki/pki-tomcat/webapps/ca

      - name: Customize CA webapp WEB-INF folder
        run: |
          # replace WEB-INF link with actual folder
          docker exec pki rm -f /var/lib/pki/pki-tomcat/webapps/ca/WEB-INF
          docker exec pki mkdir -p /var/lib/pki/pki-tomcat/webapps/ca/WEB-INF

          # create links to files in original WEB-INF folder
          docker exec pki find \
              /usr/share/pki/ca/webapps/ca/WEB-INF \
              -mindepth 1 \
              -maxdepth 1 \
              -exec ln -s {} /var/lib/pki/pki-tomcat/webapps/ca/WEB-INF \;

          # update owner/permission
          docker exec pki chown -R pkiuser:pkiuser /var/lib/pki/pki-tomcat/webapps/ca/WEB-INF

          docker exec pki ls -l /var/lib/pki/pki-tomcat/webapps/ca/WEB-INF

      - name: Customize CA webapp WEB-INF/classes folder
        run: |
          # replace WEB-INF/classes link with actual folder
          docker exec pki rm -f /var/lib/pki/pki-tomcat/webapps/ca/WEB-INF/classes
          docker exec pki mkdir -p /var/lib/pki/pki-tomcat/webapps/ca/WEB-INF/classes

          # create links to files in original WEB-INF/classes folder
          docker exec pki find \
              /usr/share/pki/ca/webapps/ca/WEB-INF/classes \
              -mindepth 1 \
              -maxdepth 1 \
              -exec ln -s {} /var/lib/pki/pki-tomcat/webapps/ca/WEB-INF/classes \;

          # update owner/permission
          docker exec pki chown -R pkiuser:pkiuser /var/lib/pki/pki-tomcat/webapps/ca/WEB-INF/classes

          docker exec pki ls -l /var/lib/pki/pki-tomcat/webapps/ca/WEB-INF/classes

      - name: Build custom auth plugin
        run: |
          # build plugin and store the classes in WEB-INF/classes
          docker exec \
              -w /usr/share/pki/server/examples/java \
              pki javac \
              -cp "/usr/share/pki/lib/*:/usr/share/pki/server/common/lib/*:/usr/share/pki/server/webapps/pki/WEB-INF/lib/*" \
              -d /var/lib/pki/pki-tomcat/webapps/ca/WEB-INF/classes \
              com/example/pki/server/auth/CustomAuthPlugin.java

          # update owner/permission
          docker exec pki chown -R pkiuser:pkiuser /var/lib/pki/pki-tomcat/webapps/ca/WEB-INF/classes

          docker exec pki ls -lR /var/lib/pki/pki-tomcat/webapps/ca/WEB-INF/classes

      - name: Add custom auth plugin
        run: |
          docker exec pki pki-server ca-auth-plugin-add \
              --class-name com.example.pki.server.auth.CustomAuthPlugin \
              CustomAuthPlugin

          docker exec pki pki-server ca-auth-plugin-find \
              | tee output

          # custom auth plugin should be added
          cat > expected << EOF
            Plugin ID: AgentCertAuth
            Class Name: com.netscape.cms.authentication.AgentCertAuthentication

            Plugin ID: CMCAuth
            Class Name: com.netscape.cms.authentication.CMCAuth

            Plugin ID: CMCAuthForEST
            Class Name: com.netscape.cms.authentication.CMCAuthForEST

            Plugin ID: CMCUserSignedAuth
            Class Name: com.netscape.cms.authentication.CMCUserSignedAuth

            Plugin ID: CustomAuthPlugin
            Class Name: com.example.pki.server.auth.CustomAuthPlugin

            Plugin ID: FlatFileAuth
            Class Name: com.netscape.cms.authentication.FlatFileAuth

            Plugin ID: SSLclientCertAuth
            Class Name: com.netscape.cms.authentication.SSLclientCertAuthentication

            Plugin ID: SessionAuthentication
            Class Name: com.netscape.cms.authentication.SessionAuthentication

            Plugin ID: SharedToken
            Class Name: com.netscape.cms.authentication.SharedSecret

            Plugin ID: TokenAuth
            Class Name: com.netscape.cms.authentication.TokenAuthentication

            Plugin ID: UidPwdDirAuth
            Class Name: com.netscape.cms.authentication.UidPwdDirAuthentication

            Plugin ID: UidPwdGroupDirAuth
            Class Name: com.netscape.cms.authentication.UidPwdGroupDirAuthentication

            Plugin ID: UidPwdPinDirAuth
            Class Name: com.netscape.cms.authentication.UidPwdPinDirAuthentication

            Plugin ID: UserPwdDirAuth
            Class Name: com.netscape.cms.authentication.UserPwdDirAuthentication
          EOF

          diff expected output

      - name: Add custom auth manager
        run: |
          docker exec pki pki-server ca-config-set auths.instance.CustomAuthManager.pluginName CustomAuthPlugin

      - name: Redeploy CA subsystem
        run: |
          docker exec pki pki-server webapp-deploy \
              --descriptor /usr/share/pki/ca/conf/Catalina/localhost/ca.xml \
              --doc-base /var/lib/pki/pki-tomcat/webapps/ca \
              --wait \
              ca

      - name: Retrieve caDirUserCert profile
        run: |
          docker exec pki pki \
              -n caadmin \
              ca-profile-show \
              --output $SHARED/CustomProfile.xml \
              caDirUserCert

          cat CustomProfile.xml

      - name: Create custom profile
        run: |
          # allow updates
          sudo chmod go+w CustomProfile.xml

          # update profile ID
          xmlstarlet edit --inplace \
              -u "/Profile/@id" \
              -v "CustomProfile" \
              CustomProfile.xml

          # update profile name
          xmlstarlet edit --inplace \
              -u "/Profile/name" \
              -v "五輪真弓" \
              CustomProfile.xml

          # update profile description
          xmlstarlet edit --inplace \
              -u "/Profile/description" \
              -v "Certificate profile for 五輪真弓" \
              CustomProfile.xml

          # update profile authenticator ID
          xmlstarlet edit --inplace \
              -u "/Profile/authenticatorId" \
              -v "CustomAuthManager" \
              CustomProfile.xml

          cat CustomProfile.xml

      - name: Add custom profile
        run: |
          docker exec pki pki \
              -n caadmin \
              ca-profile-add \
              $SHARED/CustomProfile.xml

      - name: Enable custom profile
        run: |
          docker exec pki pki \
              -n caadmin \
              ca-profile-enable \
              CustomProfile

      - name: Check custom profile info
        run: |
          docker exec pki pki \
              -n caadmin \
              ca-profile-show \
              CustomProfile \
              | tee output

          sed -n \
              -e "/^\s*Name:/p" \
              -e "/^\s*Description:/p" \
              output > actual

          cat > expected << EOF
            Name: 五輪真弓
            Description: Certificate profile for 五輪真弓
          EOF

          diff expected actual

      - name: Check custom profile config
        run: |
          docker exec pki pki \
              -n caadmin \
              ca-profile-show \
              --raw \
              CustomProfile \
              | tee output

          sed -n \
              -e "/^name=/p" \
              -e "/^desc=/p" \
              output > actual

          cat > expected << EOF
          desc=Certificate profile for 五輪真弓
          name=五輪真弓
          EOF

      - name: Check custom profile config file
        run: |
          docker exec pki cat /var/lib/pki/pki-tomcat/ca/profiles/ca/CustomProfile.cfg \
              | tee output

          sed -n \
              -e "/^name=/p" \
              -e "/^desc=/p" \
              output > actual

          cat > expected << EOF
          desc=Certificate profile for 五輪真弓
          name=五輪真弓
          EOF

          diff expected actual

      - name: Create user cert using custom profile
        run: |
          # create cert request
          docker exec pki pki nss-cert-request \
              --subject "UID=testuser" \
              --csr testuser.csr

          echo "Secret.123" > password.txt

          # issue cert
          docker exec pki pki ca-cert-issue \
              --profile CustomProfile \
              --username testuser \
              --password-file $SHARED/password.txt \
              --csr-file testuser.csr \
              --output-file testuser.crt

      - name: Check user cert
        run: |
          # import cert
          docker exec pki pki nss-cert-import testuser --cert testuser.crt
          docker exec pki pki nss-cert-show testuser | tee output

          # normalize output
          sed \
              -e '/^ *Serial Number:/d' \
              -e '/^ *Not Valid Before:/d' \
              -e '/^ *Not Valid After:/d' \
              output > actual

          cat > expected << EOF
            Nickname: testuser
            Subject DN: UID=testuser
            Issuer DN: CN=CA Signing Certificate,OU=pki-tomcat,O=EXAMPLE
            Trust Flags: u,u,u
          EOF

          diff expected actual

      - name: Disable custom profile
        run: |
          docker exec pki pki \
              -n caadmin \
              ca-profile-disable \
              CustomProfile

      - name: Remove custom profile
        run: |
          docker exec pki pki \
              -n caadmin \
              ca-profile-del \
              CustomProfile

      - name: Remove custom auth manager
        run: |
          docker exec pki pki-server ca-config-unset auths.instance.CustomAuthManager.pluginName

      - name: Remove custom auth plugin
        run: |
          docker exec pki pki-server ca-auth-plugin-del CustomAuthPlugin

          docker exec pki pki-server ca-auth-plugin-find \
              | tee output

          # custom auth plugin should be removed
          cat > expected << EOF
            Plugin ID: AgentCertAuth
            Class Name: com.netscape.cms.authentication.AgentCertAuthentication

            Plugin ID: CMCAuth
            Class Name: com.netscape.cms.authentication.CMCAuth

            Plugin ID: CMCAuthForEST
            Class Name: com.netscape.cms.authentication.CMCAuthForEST

            Plugin ID: CMCUserSignedAuth
            Class Name: com.netscape.cms.authentication.CMCUserSignedAuth

            Plugin ID: FlatFileAuth
            Class Name: com.netscape.cms.authentication.FlatFileAuth

            Plugin ID: SSLclientCertAuth
            Class Name: com.netscape.cms.authentication.SSLclientCertAuthentication

            Plugin ID: SessionAuthentication
            Class Name: com.netscape.cms.authentication.SessionAuthentication

            Plugin ID: SharedToken
            Class Name: com.netscape.cms.authentication.SharedSecret

            Plugin ID: TokenAuth
            Class Name: com.netscape.cms.authentication.TokenAuthentication

            Plugin ID: UidPwdDirAuth
            Class Name: com.netscape.cms.authentication.UidPwdDirAuthentication

            Plugin ID: UidPwdGroupDirAuth
            Class Name: com.netscape.cms.authentication.UidPwdGroupDirAuthentication

            Plugin ID: UidPwdPinDirAuth
            Class Name: com.netscape.cms.authentication.UidPwdPinDirAuthentication

            Plugin ID: UserPwdDirAuth
            Class Name: com.netscape.cms.authentication.UserPwdDirAuthentication
          EOF

          diff expected output

      - name: Remove CA
        run: docker exec pki pkidestroy -s CA -v

      - name: Check DS server systemd journal
        if: always()
        run: |
          docker exec ds journalctl -x --no-pager -u dirsrv@localhost.service

      - name: Check DS container logs
        if: always()
        run: |
          docker logs ds

      - name: Check PKI server systemd journal
        if: always()
        run: |
          docker exec pki journalctl -x --no-pager -u pki-tomcatd@pki-tomcat.service

      - name: Check PKI server access log
        if: always()
        run: |
          docker exec pki find /var/log/pki/pki-tomcat -name "localhost_access_log.*" -exec cat {} \;

      - name: Check CA debug log
        if: always()
        run: |
          docker exec pki find /var/lib/pki/pki-tomcat/logs/ca -name "debug.*" -exec cat {} \;
